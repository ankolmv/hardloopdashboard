name: Dashboard

on:
  schedule:
    # UTC: overdag (±6–23 uur NL) elke 10 min, 's nachts elk uur. GitHub slaat geplande runs soms over.
    - cron: "*/10 4-21 * * *"
    - cron: "7 0-3,22,23 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Actie (sync, goal, settings, push_workout, unpush_workout, save_workout, garmin_zones, fail_test)"
        required: false
        default: "sync"
      args:
        description: "Argumenten als JSON"
        required: false
        default: "{}"

permissions:
  contents: write   # cache-branch 'state' bijwerken
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

env:
  TZ: Europe/Amsterdam
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache-branch ophalen
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch --depth 1 origin state
            git --work-tree=state checkout FETCH_HEAD -- state.enc || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache terugzetten
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python cloud.py restore

      - name: Actie vanaf de website
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action != 'sync' && inputs.action != '' }}
        env:
          ACTION: ${{ inputs.action }}
          ARGS: ${{ inputs.args }}
        run: python cloud.py action "$ACTION" "$ARGS"

      - name: Synchroniseren
        run: python cloud.py sync

      - name: Site bouwen
        id: site
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
          ORS_KEY: ${{ secrets.ORS_KEY }}
        run: python cloud.py build site

      - name: Meldingen
        continue-on-error: true   # een mislukte melding mag de site niet tegenhouden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: python cloud.py notify

      - name: Cache versleuteld opslaan
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          python cloud.py save
          cd state
          git init -q -b state
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add state.enc
          git commit -q -m "cache $(date -Iseconds)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" state

      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.changed == 'true'
        with:
          path: site

      - id: deploy
        if: steps.site.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

      - name: Melding bij mislukte run
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$NTFY_TOPIC" ] && exit 0
          curl -s -H "Content-Type: application/json" -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"Dashboard-run mislukt\",\"message\":\"De laatste update van je dashboard is mislukt. Tik voor de details.\",\"tags\":[\"x\"],\"priority\":4,\"click\":\"$RUN_URL\"}" https://ntfy.sh/ > /dev/null
