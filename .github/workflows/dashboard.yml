name: Dashboard

on:
  schedule:
    - cron: "7,37 * * * *"   # elk halfuur (GitHub slaat geplande runs soms over)
  workflow_dispatch:
    inputs:
      action:
        description: "Actie (sync, goal, settings, push_workout, unpush_workout, garmin_zones)"
        required: false
        default: "sync"
      args:
        description: "Argumenten als JSON"
        required: false
        default: "{}"

permissions:
  contents: write   # cache-branch 'state' bijwerken
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

env:
  TZ: Europe/Amsterdam
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache-branch ophalen
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch --depth 1 origin state
            git --work-tree=state checkout FETCH_HEAD -- state.enc || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache terugzetten
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python cloud.py restore

      - name: Actie vanaf de website
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action != 'sync' && inputs.action != '' }}
        env:
          ACTION: ${{ inputs.action }}
          ARGS: ${{ inputs.args }}
        run: python cloud.py action "$ACTION" "$ARGS"

      - name: Synchroniseren
        run: python cloud.py sync

      - name: Site bouwen
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: python cloud.py build site

      - name: Cache versleuteld opslaan
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          python cloud.py save
          cd state
          git init -q -b state
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add state.enc
          git commit -q -m "cache $(date -Iseconds)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" state

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
